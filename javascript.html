<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(48, 38, 38);
            color: rgb(241, 238, 238);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 19px;
            line-height: 1.6;
            margin: 30px;
            padding: 30px;
            border: 5px solid rgb(48, 38, 38);
            box-shadow: 0 0 10px rgb(48, 38, 38);
        }
        button {
            background-color: rgb(255, 252, 252);
            color: rgb(128, 82, 237);
            text-align: center;
            padding: 20px;
            border: 4px solid rgb(93, 94, 87);
            border-radius: 10px;
            box-shadow: 0 0 10px rgb(209, 237, 49);
        }
    </style>
</head>
<body>
    <p id="demo">Hello, World!</p>
    <button onclick="document.getElementById('demo').innerHTML = Date()">Click Me!</button>
    
</body>
</html>
